services:
  app:
    build: .
    env_file: .env
    environment:
      # Keep the Telegram session and status file inside the mounted volume.
      TG_SESSION_NAME: data/telegram_session
      STATUS_FILE: data/status.json
      # Inside the container the dashboard must listen on all interfaces; the port is
      # published to localhost only below (the dashboard has no login).
      UI_HOST: 0.0.0.0
      UI_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
